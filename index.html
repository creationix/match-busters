<!doctype html>
<html lang="en">

<style>
  :root { --bg1:#231942; --bg2:#12092b; --panel:#2f2157; --panel2:#3c2c6e; --text:#f4efff; --muted:#b9add9; --accent:#ffd84a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* The page colour is on <html> too, so any strip the layout doesn't reach is never white. */
  html { height: 100%; min-height: calc(100% + env(safe-area-inset-top, 0px)); margin: 0; background: #12092b; overflow: hidden; }
  body { margin: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 75%);
    color: var(--text); font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; overscroll-behavior: none;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  /* Installed on iPad/iPhone the "100%" box stops short of the home-indicator area; the real screen height does not. */
  @supports (height: 100dvh) { body { height: 100dvh; } }
  @media (display-mode: standalone) { body { height: 100vh; } }
  #game { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: calc(10px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal)); }
  #hud { width: 100%; max-width: 560px; }
  #hudTop { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #hudTop .title { flex: 1; min-width: 0; }
  #lvName { font-weight: 800; font-size: 17px; }
  #lvGoal { color: var(--muted); font-size: 13px; line-height: 1.25; }
  .iconBtn { width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--panel2); color: var(--text); font-size: 18px; cursor: pointer; }
  .iconBtn:hover { filter: brightness(1.2); }
  #stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel); border-radius: 12px; padding: 6px 10px; text-align: center; }
  .stat .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stat .val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; }
  .stat.warn .val { color: #ff7b7b; }
  .stat.bump .val { animation: bump .25s; }
  @keyframes bump { 40% { transform: scale(1.25); color: var(--accent); } }
  #bar { height: 8px; border-radius: 4px; background: var(--panel); margin-top: 8px; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: linear-gradient(90deg, #ffb347, var(--accent)); border-radius: 4px; transition: width .25s; box-shadow: 0 0 12px var(--accent); }
  #boardWrap { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }  /* phones held sideways: HUD moves beside the board so the board keeps the full height */
  @media (orientation: landscape) and (max-height: 540px) {
    #game { flex-direction: row; align-items: center; justify-content: center; gap: 14px; }
    #hud { width: 220px; flex: none; }
    #stats { grid-template-columns: 1fr; gap: 6px; }
    .stat { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; }
    #boardWrap { flex: 0 1 auto; width: auto; height: 100%; aspect-ratio: 1; max-width: calc(100% - 234px); }
  }
  #stage { position: relative; line-height: 0; }
  #board { display: block; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.07), 0 0 60px rgba(120,80,255,.25); cursor: pointer; touch-action: none; }
  #floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 16px; line-height: 1; }
  .float { position: absolute; transform: translate(-50%,-50%); font-weight: 900; color: #fff; white-space: nowrap;
    text-shadow: 0 2px 0 rgba(20,8,45,.9), 0 0 12px rgba(255,255,255,.6); animation: floatUp .95s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 0; margin-top: 0; transform: translate(-50%,-50%) scale(.4); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); } 30% { transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; margin-top: -60px; transform: translate(-50%,-50%) scale(1); } }
  #toast { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: 44px; font-weight: 900; color: var(--accent); line-height: 1;
    text-shadow: 0 3px 0 #7a4b00, 0 0 24px rgba(255,216,74,.8); pointer-events: none; opacity: 0; white-space: nowrap; }
  #toast.show { animation: toast .9s ease-out; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4) rotate(-6deg); } 20% { opacity: 1; transform: translate(-50%,-50%) scale(1.2) rotate(2deg); } 70% { opacity: 1; transform: translate(-50%,-60%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-90%) scale(1); } }

  .screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; overflow-y: auto;
    padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));
    background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 75%); }
  .screen.dim { background: rgba(10,4,26,.78); backdrop-filter: blur(3px); }
  .screen.show { display: flex; }
  .card { width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
  .dim .card { background: var(--panel); border-radius: 20px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }

  h2 { margin: 0; font-size: 28px; font-weight: 900; }
  .sub { color: var(--muted); margin: 0 0 10px; }
  #logo { display: block; margin: 0 auto 6px; }

    background: linear-gradient(180deg, #ffe680, #ffb830); box-shadow: 0 4px 0 #b3720a; }
  button.big:active { transform: translateY(3px); box-shadow: 0 1px 0 #b3720a; }
  button.big.alt { background: var(--panel2); color: var(--text); box-shadow: 0 4px 0 #1c1140; }
  button.big.alt:active { box-shadow: 0 1px 0 #1c1140; }
  #lvGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0; }
  .lvBtn { aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--panel2); color: var(--text); cursor: pointer; font-weight: 900; font-size: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 #1c1140; }
  .lvBtn small { font-size: 12px; color: var(--accent); letter-spacing: 1px; }
  .lvBtn .kind { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .lvBtn:disabled { opacity: .4; cursor: default; }

  .toggle { width: 56px; height: 30px; border-radius: 15px; border: 0; background: #5a4a8a; position: relative; cursor: pointer; transition: background .15s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .toggle.on { background: #3ecf5e; }

  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }
  #loadErr { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 99; background: #9c1c1c; color: #fff; padding: 12px; text-align: center; }
</style>

  window.addEventListener('load', function () { setTimeout(function () { if (!window.__mb) document.getElementById('loadErr').style.display = 'block'; }, 4000); });

<script type="module">
import * as THREE from './vendor/three-0.160.0/build/three.module.js';
import { EffectComposer } from './vendor/three-0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/three-0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/three-0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './vendor/three-0.160.0/examples/jsm/postprocessing/OutputPass.js';
import { RoomEnvironment } from './vendor/three-0.160.0/examples/jsm/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from './vendor/three-0.160.0/examples/jsm/geometries/RoundedBoxGeometry.js';

const N = 8, TAU = Math.PI * 2;
// One shape = one colour, always.
const SHAPES = [
  { name: 'Circle',   plural: 'green circles',    color: '#3ecf5e', dark: '#17803a', light: '#b4f8c2' },
  { name: 'Square',   plural: 'red squares',      color: '#ef4444', dark: '#9c1c1c', light: '#ffb1b1' },
  { name: 'Doughnut', plural: 'blue doughnuts',   color: '#3b82f6', dark: '#1a4aab', light: '#b3d0ff' },
  { name: 'Star',     plural: 'orange stars',     color: '#fb923c', dark: '#b8520b', light: '#ffdcb8' },
  { name: 'Diamond',  plural: 'purple diamonds',  color: '#a855f7', dark: '#6420a0', light: '#e4c6ff' },
];
const LEVELS = [
  { type: 'score',   goal: 1500, moves: 20 },
  { type: 'collect', shape: 0, count: 25, moves: 18 },
  { type: 'timed',   goal: 2000, time: 60 },
  { type: 'score',   goal: 2800, moves: 24 },
  { type: 'collect', shape: 4, count: 35, moves: 22 },
  { type: 'timed',   goal: 3500, time: 90 },
  { type: 'collect', shape: 3, count: 45, moves: 25 },
  { type: 'score',   goal: 4500, moves: 28 },
];
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');

// ---------- persistence ----------
let save = { stars: [], sound: true, music: true };
try { Object.assign(save, JSON.parse(localStorage.getItem('matchbusters') || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem('matchbusters', JSON.stringify(save)); } catch (e) {} }

// ---------- audio (all synthesised, no asset files) ----------
let AC = null, musicGain = null, sfxGain = null, nextT = 0, step = 0;
function initAudio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    musicGain = AC.createGain(); musicGain.gain.value = save.music ? 1 : 0; musicGain.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.gain.value = 1; sfxGain.connect(AC.destination);
    nextT = AC.currentTime + 0.1;
    setInterval(musicTick, 100);
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, d, type, vol, when, to, dest) {
  if (!AC) return;
  const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t); o.stop(t + d + 0.03);
}
function noise(d, vol, lowpass) {
  if (!AC) return;
  const len = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf; g.gain.value = vol;
  if (lowpass) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass; s.connect(f); f.connect(g); } else s.connect(g);
  g.connect(sfxGain); s.start();
}
const on = () => save.sound && AC;
const sfx = {
  click()  { if (on()) tone(700, 0.05, 'square', 0.06, 0, 900); },
  select() { if (on()) tone(920, 0.06, 'sine', 0.14); },
  swap()   { if (on()) tone(420, 0.1, 'triangle', 0.2, 0, 780); },
  bad()    { if (on()) { tone(190, 0.12, 'sawtooth', 0.1, 0, 130); tone(150, 0.16, 'sawtooth', 0.1, 0.1, 100); } },
  pop(combo) {
    if (!on()) return;
    const f = 523.25 * Math.pow(2, Math.min(combo - 1, 9) * 2 / 12);
    tone(f, 0.14, 'sine', 0.28); tone(f * 1.5, 0.18, 'sine', 0.18, 0.06); tone(f * 2, 0.2, 'triangle', 0.08, 0.1);
    noise(0.08, 0.08);
  },
  land()   { if (on()) { tone(130, 0.1, 'sine', 0.22, 0, 60); noise(0.05, 0.05, 900); } },
  forge()  { if (on()) { tone(660, 0.12, 'triangle', 0.16, 0.05); tone(990, 0.12, 'triangle', 0.16, 0.14); tone(1320, 0.25, 'triangle', 0.16, 0.23); } },
  line()   { if (on()) { tone(260, 0.35, 'sawtooth', 0.16, 0, 2200); noise(0.3, 0.2); } },
  bomb()   { if (on()) { tone(140, 0.55, 'sine', 0.5, 0, 38); noise(0.5, 0.4, 1400); } },
  color()  { if (on()) { [0, 2, 4, 7, 9, 12, 16, 19].forEach((s, i) => tone(523.25 * Math.pow(2, s / 12), 0.25, 'triangle', 0.14, i * 0.045)); noise(0.6, 0.15); } },
  shuffle(){ if (on()) [0, 1, 2, 3, 4].forEach(i => tone(300 + Math.random() * 600, 0.07, 'square', 0.07, i * 0.06)); },
  tick()   { if (on()) tone(1100, 0.05, 'square', 0.1); },
  win()    { if (on()) [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => { tone(f, 0.35, 'triangle', 0.22, i * 0.12); tone(f / 2, 0.35, 'sine', 0.12, i * 0.12); }); },
  lose()   { if (on()) [392, 329.63, 261.63, 196].forEach((f, i) => tone(f, 0.4, 'triangle', 0.2, i * 0.2)); },
};
const PROG = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]];
const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
function musicTick() {
  if (!AC || !save.music || AC.state !== 'running') return;
  if (nextT < AC.currentTime) nextT = AC.currentTime + 0.05;
  while (nextT < AC.currentTime + 0.3) {
    const chord = PROG[(step >> 3) % 4], i = step % 8, when = nextT - AC.currentTime;
    tone(chord[ARP[i]] * (i >= 4 ? 2 : 1), 0.5, 'sine', 0.035, when, null, musicGain);
    if (i === 0) tone(chord[0] / 2, 2.3, 'triangle', 0.04, when, null, musicGain);
    nextT += 0.3; step++;
  }
}
window.addEventListener('pointerdown', initAudio, true);
window.addEventListener('keydown', initAudio, true);
window.addEventListener('touchend', initAudio, true); // iOS only unlocks audio on touchend/click
window.addEventListener('click', initAudio, true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
document.addEventListener('click', e => { if (e.target.closest('button')) sfx.click(); });

// ---------- flat icons (menu logo, HUD) ----------
function shapePath(c, t, R) {
  c.beginPath();
  if (t === 0) c.arc(0, 0, R, 0, TAU);
  else if (t === 1) { const s = R * 0.88; if (c.roundRect) c.roundRect(-s, -s, 2 * s, 2 * s, R * 0.22); else c.rect(-s, -s, 2 * s, 2 * s); }
  else if (t === 2) { c.arc(0, 0, R, 0, TAU); c.moveTo(R * 0.42, 0); c.arc(0, 0, R * 0.42, 0, TAU, true); }
  else if (t === 3) {
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? R * 0.55 : R * 1.15;
      c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath();
  } else { c.moveTo(0, -R * 1.15); c.lineTo(R * 0.92, 0); c.lineTo(0, R * 1.15); c.lineTo(-R * 0.92, 0); c.closePath(); }
}
function drawIcon(c, t, x, y, s) {
  const R = s * 0.33, sh = SHAPES[t];
  c.save(); c.translate(x, y);
  shapePath(c, t, R);
  const g = c.createLinearGradient(0, -R, 0, R);
  g.addColorStop(0, sh.light); g.addColorStop(0.45, sh.color); g.addColorStop(1, sh.dark);
  c.fillStyle = g; c.fill('evenodd');
  c.lineWidth = Math.max(1, s * 0.035); c.strokeStyle = sh.dark; c.lineJoin = 'round'; c.stroke();
  c.restore();
}
function iconCanvas(t, px) {
  const el = document.createElement('canvas'), d = window.devicePixelRatio || 1;
  el.width = el.height = px * d; el.style.width = el.style.height = px + 'px';
  const c = el.getContext('2d'); c.scale(d, d);
  drawIcon(c, t, px / 2, px / 2, px * 1.25);
  return el;
}
{ const c = $('logo').getContext('2d'); for (let i = 0; i < 5; i++) drawIcon(c, i, 30 + i * 60, 35, 62); }

// ---------- game state ----------
const cv = $('board');
let size = 400;
const G = { active: false, paused: false, busy: false, ended: false, timeUp: false, gen: 0, grid: null, level: 0, lv: null,
  score: 0, moves: 0, timeLeft: 0, collected: [0, 0, 0, 0, 0], sel: null, drag: null, hint: null, idle: 0,
  dying: [], parts: [], beams: [], blasts: [], timers: [], waiters: [], flash: 0, flashColor: '#ffffff', shake: 0 };

const rnd = n => Math.floor(Math.random() * n);
function mk(t, r, c, sp, dir) { return { t, r, c, x: c, y: r, v: 0, sp: sp || null, dir: dir || null, born: 1, mesh: null }; }

function wouldMatch(g, r, c, t) {
  return (c >= 2 && g[r][c - 1] && g[r][c - 2] && g[r][c - 1].t === t && g[r][c - 2].t === t) ||
         (r >= 2 && g[r - 1][c] && g[r - 2][c] && g[r - 1][c].t === t && g[r - 2][c].t === t);
}
function newBoard() {
  do {
    G.grid = [];

function buildMesh(p) {

  const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.3, roughness: p.t === 0 || p.t === 2 ? 0.28 : 0.5, emissive: color, emissiveIntensity: 0.16, envMapIntensity: 0.55, flatShading: p.t === 4 });
  const main = new THREE.Mesh(GEOS[p.t], mat); g.add(main);
  const extra = new THREE.Group(); g.add(extra);
  if (p.sp === 'line') {
    const bar = new THREE.Mesh(BAR, WHITE), a = new THREE.Mesh(CONE, WHITE), b = new THREE.Mesh(CONE, WHITE);
    a.position.x = 0.4; a.rotation.z = -Math.PI / 2; b.position.x = -0.4; b.rotation.z = Math.PI / 2;
    extra.add(bar, a, b); extra.position.z = 0.34;

  } else if (p.sp === 'bomb') {
    const core = new THREE.Mesh(CORE, BLACK), spark = new THREE.Mesh(SPARK, GOLD), halo = new THREE.Mesh(HALO, HALOMAT);
    core.position.z = 0.3; spark.position.set(0.1, 0.13, 0.42); halo.position.z = -0.2; halo.name = 'halo';
    extra.add(core, spark, halo);
  } else if (p.sp === 'color') {

}

// particles
const PMAX = 2000;
const pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.26, map: dotTex, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
points.frustumCulled = false; scene.add(points);

const isCell = (cell, p) => cell && cell.r === p.r && cell.c === p.c;
function sync(time) {
  const seen = new Set(), pulse = 0.5 + 0.5 * Math.sin(time * 5);
  if (G.grid) {
    for (const row of G.grid) for (const p of row) {
      if (!p) continue;
      const g = p.mesh || (p.mesh = buildMesh(p)), u = g.userData;
      seen.add(g);
      const b = p.born - 1;
      let sc = p.born < 1 ? 0.2 + 0.8 * (1 + 2.7 * b * b * b + 1.7 * b * b) : 1, z = 0;
      const selected = isCell(G.sel, p);
      if (selected) { sc *= 1.18 + 0.05 * Math.sin(time * 9); z = 0.5; }
      else if (G.hint && (isCell(G.hint[0], p) || isCell(G.hint[1], p))) sc *= 1 + 0.1 * Math.sin(time * 8);
      if (p.sp) sc *= 1 + 0.04 * pulse;
      g.position.set(p.x - 3.5, 3.5 - p.y, z);
      g.scale.setScalar(sc);
      const m = u.main;
      if (p.t === 4) m.rotation.y = time * (selected ? 5 : 1.3) + u.phase;
      else m.rotation.y = selected ? time * 5 : Math.sin(time * 1.4 + u.phase) * 0.4;
      m.rotation.x = Math.sin(time * 1.1 + u.phase * 2) * 0.2;
      if (p.t === 3) m.rotation.z = Math.sin(time * 0.9 + u.phase) * 0.15;
      u.mat.emissiveIntensity = p.sp ? 0.4 + 0.35 * pulse : selected ? 0.5 : 0.16;
      if (p.sp === 'color') u.extra.rotation.z = time * 2.5;
      else if (p.sp === 'bomb') u.extra.getObjectByName('halo').scale.setScalar(1 + 0.12 * pulse);
    }
    for (const d of G.dying) {
      const p = d.p, g = p.mesh || (p.mesh = buildMesh(p)), u = g.userData, k = 1 - d.life;
      seen.add(g);
      g.position.set(p.x - 3.5, 3.5 - p.y, 0.2 + k);
      g.scale.setScalar(k < 0.3 ? 1 + k * 1.2 : Math.max(0.001, 1.36 * (d.life / 0.7)));
      u.main.rotation.z += 0.25; u.main.rotation.y += 0.2;
      u.mat.emissive.set(0xffffff); u.mat.emissiveIntensity = 0.3 + k * 1.6;
      u.extra.visible = false;
    }
  }
  for (const m of liveMeshes) if (!seen.has(m)) { pieceGroup.remove(m); m.userData.mat.dispose(); }
  liveMeshes = seen;

  const fx = new Set();
  for (const b of G.beams) {
    const m = b.mesh || (b.mesh = fxGroup.add(new THREE.Mesh(PLANE, additive(b.color))) && fxGroup.children[fxGroup.children.length - 1]);
    fx.add(m);
    const w = 0.15 + 0.9 * b.life;
    if (b.dir === 'h') { m.position.set(0, 3.5 - b.r, 0.7); m.scale.set(12, w, 1); } else { m.position.set(b.c - 3.5, 0, 0.7); m.scale.set(w, 12, 1); }
    m.material.opacity = b.life; m.material.color.set(b.color).multiplyScalar(1.5);
  }
  for (const b of G.blasts) {
    const m = b.mesh || (b.mesh = fxGroup.add(new THREE.Mesh(RINGFX, additive(b.color))) && fxGroup.children[fxGroup.children.length - 1]);
    fx.add(m);
    m.position.set(b.c - 3.5, 3.5 - b.r, 0.6);
    m.scale.setScalar(b.size * (0.2 + 0.8 * (1 - b.life * b.life)));
    m.material.opacity = b.life;
  }
  for (const m of liveFx) if (!fx.has(m)) { fxGroup.remove(m); m.material.dispose(); }
  liveFx = fx;

  selMesh.visible = !!G.sel;
  if (G.sel) { selMesh.position.x = G.sel.c - 3.5; selMesh.position.y = 3.5 - G.sel.r; selMesh.material.opacity = 0.6 + 0.4 * pulse; }
  flashMesh.visible = G.flash > 0;
  if (G.flash > 0) { flashMesh.material.color.set(G.flashColor); flashMesh.material.opacity = G.flash * 0.55; }

  const n = Math.min(G.parts.length, PMAX);
  for (let i = 0; i < n; i++) {
    const q = G.parts[i], f = Math.max(0, q.life) * 1.6;
    pPos[i * 3] = q.x; pPos[i * 3 + 1] = q.y; pPos[i * 3 + 2] = q.z;
    pCol[i * 3] = q.r * f; pCol[i * 3 + 1] = q.g * f; pCol[i * 3 + 2] = q.b * f;
  }
  pGeo.setDrawRange(0, n); pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;

  const sh = G.shake * 0.18;
  camera.position.set(Math.sin(time * 0.35) * 0.45 + (Math.random() - 0.5) * sh, Math.cos(time * 0.28) * 0.3 + (Math.random() - 0.5) * sh, CAM_D);
  camera.lookAt(0, 0, 0);
}
function render(time) { sync(time); composer.render(); }

const v3 = new THREE.Vector3();
function floatText(col, row, text, pts) {
  v3.set(col - 3.5, 3.5 - row, 0.5).project(camera);
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = text;
  el.style.left = Math.min(92, Math.max(8, (v3.x + 1) * 50)) + '%';
  el.style.top = Math.max(6, (1 - v3.y) * 50) + '%';
  el.style.fontSize = Math.round(size / 28 + Math.min(pts / 30, size / 22)) + 'px';
  if (pts >= 200) el.style.color = '#ffd84a';
  el.addEventListener('animationend', () => el.remove());
  $('floats').appendChild(el);
}

// ---------- input ----------
const canInput = () => G.active && !G.paused && !G.busy && !G.ended && !G.timeUp;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit = new THREE.Vector3();
function cellAt(e) {
  const b = cv.getBoundingClientRect();
  ndc.set((e.clientX - b.left) / b.width * 2 - 1, 1 - (e.clientY - b.top) / b.height * 2);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(zPlane, hit)) return null;
  const c = Math.floor(hit.x + 4), r = Math.floor(4 - hit.y);
  return r >= 0 && c >= 0 && r < N && c < N ? { r, c } : null;
}
cv.addEventListener('pointerdown', e => {
  if (!canInput()) return;
  const cell = cellAt(e); if (!cell) return;
  G.idle = 0; G.hint = null;
  const s = G.sel;
  if (s && Math.abs(s.r - cell.r) + Math.abs(s.c - cell.c) === 1) { G.sel = null; trySwap(s, cell); return; }
  G.sel = s && s.r === cell.r && s.c === cell.c ? null : cell;
  if (G.sel) sfx.select();
  G.drag = { x: e.clientX, y: e.clientY, cell };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!G.drag || !canInput()) return;
  const dx = e.clientX - G.drag.x, dy = e.clientY - G.drag.y, th = size / N * 0.35;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  const from = G.drag.cell;
  const to = Math.abs(dx) > Math.abs(dy) ? { r: from.r, c: from.c + Math.sign(dx) } : { r: from.r + Math.sign(dy), c: from.c };
  G.drag = null;
  if (to.r < 0 || to.c < 0 || to.r >= N || to.c >= N) return;
  G.sel = null; trySwap(from, to);
});
const endDrag = () => { G.drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// ---------- loop ----------
function resize() {
  const wrap = $('boardWrap'), pr = Math.min(window.devicePixelRatio || 1, 2);
  size = Math.max(160, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight - 4, 640)));
  renderer.setPixelRatio(pr); renderer.setSize(size, size, false);
  composer.setPixelRatio(pr); composer.setSize(size, size);
  cv.style.width = cv.style.height = size + 'px';
}
window.addEventListener('resize', resize);

function update(dt) {
  let moving = false;
  for (const row of G.grid) for (const p of row) {
    if (!p) continue;
    const dx = p.c - p.x, dy = p.r - p.y, d = Math.hypot(dx, dy);
    if (d > 0.0005) {
      p.v = Math.min(26, Math.max(p.v, 5) + 50 * dt);
      const st = p.v * dt;
      if (st >= d) { p.x = p.c; p.y = p.r; p.v = 0; } else { p.x += dx / d * st; p.y += dy / d * st; moving = true; }
    }
    if (p.born < 1) p.born = Math.min(1, p.born + dt * 4.5);
  }
  for (const d of G.dying) d.life -= dt / 0.24;
  G.dying = G.dying.filter(d => d.life > 0);
  for (const q of G.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.vy -= 9 * dt; q.life -= dt / 0.7; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const b of G.beams) b.life -= dt / 0.4;
  G.beams = G.beams.filter(b => b.life > 0);
  for (const b of G.blasts) b.life -= dt / b.dur;
  G.blasts = G.blasts.filter(b => b.life > 0);
  G.flash = Math.max(0, G.flash - dt / 0.5);
  G.shake = Math.max(0, G.shake - dt * 2.5);
  if (G.timers.length) {
    const due = [];
    G.timers = G.timers.filter(t => { t.t -= dt; if (t.t <= 0) { due.push(t); return false; } return true; });
    due.forEach(t => t.res());
  }
  if (!moving && G.waiters.length) { const w = G.waiters; G.waiters = []; w.forEach(f => f()); }
  if (canInput()) { G.idle += dt; if (G.idle > 6 && !G.hint) G.hint = findMove(); }
  if (G.lv.time && !G.ended && !G.timeUp) {
    G.timeLeft -= dt;
    if (G.timeLeft <= 0) { G.timeLeft = 0; G.timeUp = true; G.sel = null; G.drag = null; checkEnd(); }
    const s = Math.ceil(G.timeLeft);
    if (s !== lastSec) { lastSec = s; hud(); if (s <= 5 && s > 0) sfx.tick(); }
  }
}
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (G.active && !G.paused && G.grid) update(dt);
  if (G.active) render(ts / 1000);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
// exposed for debugging in the console
window.__mb = { G, save, sfx, startLevel, quit, show, setPaused, update, render, settled, trySwap, formsMatch, findMove, findMatches, clearStep, gravity, mk };
